<!doctype html>
<html lang="en" data-mode="system" data-accent="blue">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8"><title>ModelDeck — One workspace. Any model.</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--panel:#fff;--panel2:#f0f0f3;--text:#1d1d1f;--muted:#77777f;--line:#e5e5ea;--accent:#3478f6;--accent-soft:#e8efff;--bubble:#ececf0;--shadow:0 12px 36px #10182812;font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
html[data-mode=dark]{color-scheme:dark;--bg:#101012;--panel:#19191d;--panel2:#242428;--text:#f5f5f7;--muted:#a1a1aa;--line:#34343a;--accent-soft:color-mix(in srgb,var(--accent) 17%,var(--panel));--bubble:#29292f;--shadow:0 14px 40px #0005}
@media(prefers-color-scheme:dark){html[data-mode=system]{color-scheme:dark;--bg:#101012;--panel:#19191d;--panel2:#242428;--text:#f5f5f7;--muted:#a1a1aa;--line:#34343a;--accent-soft:color-mix(in srgb,var(--accent) 17%,var(--panel));--bubble:#29292f;--shadow:0 14px 40px #0005}}
html[data-accent=midnight]{--accent:#727c91;--accent-soft:#e9ebef}html[data-accent=emerald]{--accent:#169b72;--accent-soft:#dcf5eb}html[data-accent=violet]{--accent:#8064df;--accent-soft:#eee9ff}html[data-accent=rose]{--accent:#d95780;--accent-soft:#ffe8ef}html[data-accent=amber]{--accent:#ad741b;--accent-soft:#fff1d8}html[data-accent=ocean]{--accent:#087f9a;--accent-soft:#dff6fa}
html[data-mode=dark][data-accent],html[data-mode=system][data-accent]{--accent-soft:color-mix(in srgb,var(--accent) 17%,var(--panel))}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior:none}body{background:var(--bg);color:var(--text);transition:background .18s,color .18s}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:2px}button:disabled{opacity:.48;cursor:not-allowed}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);height:var(--visual-height,100dvh);min-height:0;max-width:1600px;margin:auto;overflow:hidden;background:var(--bg)}
.side{min-width:0;min-height:0;padding:18px 12px calc(14px + env(safe-area-inset-bottom));border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;background:var(--panel);z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:720;font-size:18px;letter-spacing:-.035em;padding:4px 8px 8px}.logo{width:30px;height:30px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:white;font-size:19px}
.new,.primary{background:var(--accent);color:#fff;border:0;border-radius:13px;padding:11px 14px;font-weight:650;box-shadow:0 3px 9px color-mix(in srgb,var(--accent) 18%,transparent);transition:filter .15s,transform .15s}.new:hover,.primary:hover{filter:brightness(1.05)}.new:active,.primary:active,.iconbtn:active,.suggest:active{transform:scale(.985)}
.navbtn,.history button{background:transparent;border:0;text-align:left;padding:10px 11px;border-radius:11px;color:var(--muted);width:100%;min-height:42px}.navbtn:hover,.history button:hover{background:var(--panel2);color:var(--text)}.side-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;padding:4px 10px}.history{overflow:auto;overscroll-behavior:contain;display:grid;align-content:start;gap:3px;min-height:0}.history button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.side-bottom{margin-top:auto;display:grid;gap:4px}.side-bottom .navbtn span{display:block;font-size:11px;padding-left:23px;margin-top:1px;opacity:.8}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;height:100%}.top{flex:0 0 62px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:12px;background:var(--bg);z-index:2}
.modelpick{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:9px 12px;max-width:min(70vw,420px);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-actions{display:flex;gap:8px}.iconbtn{width:39px;height:39px;flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:13px;display:grid;place-items:center;font-size:16px;transition:background .15s,transform .15s}.iconbtn:hover{background:var(--panel2)}
.chat{width:min(820px,100%);margin:0 auto;flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:32px 22px 22px;scroll-behavior:smooth;overflow-wrap:anywhere}.welcome{min-height:60%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:34px 0}.welcome[hidden]{display:none}.welcome h1{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.055em;font-weight:680;margin:0;max-width:620px}.welcome p{color:var(--muted);margin:0;font-size:14px}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px;width:min(570px,100%)}
.suggest{background:var(--panel);border:1px solid var(--line);border-radius:16px;text-align:left;padding:14px;transition:transform .15s,border-color .15s,background .15s;min-height:76px}.suggest:hover{border-color:color-mix(in srgb,var(--accent) 65%,var(--line));background:var(--accent-soft)}.suggest small{display:block;color:var(--muted);margin-top:3px;font-size:12px}
.messages{display:grid;gap:25px;padding-bottom:12px}.message{animation:rise .18s ease both;max-width:100%;min-width:0;overflow-wrap:anywhere}.message.user{margin-left:auto;max-width:min(86%,620px);background:var(--bubble);padding:12px 15px;border-radius:20px 20px 6px 20px;white-space:pre-wrap}.message.assistant{white-space:pre-wrap;padding:0 2px;line-height:1.72}.message.error{color:var(--muted);font-size:14px}.composer-wrap{flex:0 0 auto;padding:8px 20px max(14px,env(safe-area-inset-bottom));width:min(860px,100%);margin:0 auto;background:var(--bg)}.composer{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:23px;padding:7px 8px 7px 15px;display:flex;align-items:flex-end;gap:9px;transition:border-color .15s,box-shadow .15s}.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 8%,transparent),var(--shadow)}.composer textarea{resize:none;min-height:42px;max-height:180px;border:0;outline:0;background:transparent;flex:1;min-width:0;padding:10px 0;line-height:1.4;overflow:auto}.composer textarea:focus-visible{outline:none}.send{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:15px;background:var(--accent);color:white;font-size:22px;display:grid;place-items:center}.hint{text-align:center;color:var(--muted);font-size:11px;padding-top:9px}.status{min-height:0;text-align:center;color:var(--muted);font-size:12px;padding:0 10px}.status:not(:empty){padding-top:6px}
.overlay{position:fixed;inset:0;background:#11182766;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:14px}.overlay.open{display:flex;animation:fade .14s}.sheet{width:min(560px,100%);max-height:min(90dvh,860px);overflow:auto;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line);border-radius:25px;padding:22px;box-shadow:var(--shadow);animation:rise .18s ease;padding-bottom:max(20px,env(safe-area-inset-bottom))}.sheet h2{margin:0 0 4px;font-size:22px;letter-spacing:-.04em}.sub{color:var(--muted);margin:0 0 18px;font-size:13px}.field{display:grid;gap:7px;margin:13px 0}.field label,.group-title{font-size:13px;color:var(--muted);font-weight:620}.field input,.field select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);outline-offset:1px}.field-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.mode,.theme{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center}.mode.selected,.theme.selected{border:2px solid var(--accent);padding:10px 7px;background:var(--accent-soft)}.mode strong,.mode small{display:block}.mode strong{font-size:13px}.mode small{font-size:11px;color:var(--muted);margin-top:3px}.theme-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.swatch{width:24px;height:24px;display:block;margin:0 auto 7px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px #0001}.theme{font-size:12px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.secondary{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:42px}.fine{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.55}.mobile-menu{display:none}.drawer-shade{display:none}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media(max-width:760px){.app{grid-template-columns:minmax(0,1fr);max-width:none}.side{position:fixed;inset:0 auto 0 0;width:min(84vw,310px);height:var(--visual-height,100dvh);transform:translateX(-105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);padding-top:max(18px,env(safe-area-inset-top));z-index:41}.side.open{transform:translateX(0)}.drawer-shade.open{display:block;position:fixed;inset:0;border:0;background:#11182755;z-index:40}.mobile-menu{display:grid}.top{flex-basis:58px;padding:0 12px;padding-top:env(safe-area-inset-top);height:auto;min-height:58px;gap:8px}.modelpick{max-width:calc(100vw - 154px);font-size:12px;padding:8px 10px}.top-actions{gap:6px}.top-actions .iconbtn{width:36px;height:36px;border-radius:12px}.chat{padding:24px 16px 12px}.composer-wrap{padding:7px 11px max(9px,env(safe-area-inset-bottom))}.composer{border-radius:21px;padding-left:13px}.composer textarea{min-height:40px;max-height:140px}.send{width:40px;height:40px;flex-basis:40px;border-radius:14px}.suggestions{grid-template-columns:1fr;gap:8px}.suggest{min-height:63px;padding:12px 13px}.welcome{min-height:100%;padding:26px 0}.welcome h1{font-size:clamp(27px,8vw,35px)}.theme-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.overlay{padding:7px;padding-bottom:max(7px,env(safe-area-inset-bottom))}.sheet{border-radius:25px 25px 19px 19px;padding:20px 17px max(18px,env(safe-area-inset-bottom));max-height:88dvh}.message.user{max-width:92%}.hint{font-size:10px}.side-bottom{padding-bottom:5px}}
@media(max-width:360px){.top-actions #topAppearance{display:none}.modelpick{max-width:calc(100vw - 115px)}.modes{gap:5px}.mode{padding:9px 4px}.mode.selected{padding:8px 3px}.mode strong{font-size:12px}.mode small{font-size:10px}.theme-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.modelpick{appearance:auto;-webkit-appearance:auto;cursor:pointer;min-width:0;padding-right:10px}
.model-actions{display:flex;gap:8px;margin:10px 0}
.model-actions button{flex:1}
.model-state{font-size:12px;color:var(--muted);min-height:18px;margin-top:8px}
.model-help{font-size:12px;line-height:1.5;color:var(--muted);margin-top:12px}
@media(max-width:760px){.modelpick{max-width:calc(100vw - 145px)}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"><div class="brand"><span class="logo">✳</span>ModelDeck</div><button class="new" id="newChat">＋ New chat</button><div class="side-label">Recent chats</div><nav class="history" id="history"></nav><div class="side-bottom"><button class="navbtn" id="connections">⚙ Connections & models</button><button class="navbtn" id="appearance">◐ Appearance <span id="themeLabel">System · Apple Blue</span></button><button class="navbtn" id="clear">⌫ Clear chats</button></div></aside>
<main class="main"><header class="top"><div style="display:flex;align-items:center;gap:8px;min-width:0"><button class="iconbtn mobile-menu" id="menu" aria-label="Open menu">☰</button><select class="modelpick" id="model" aria-label="Switch model" title="Switch model"><option value="openai/gpt-4o-mini">openai/gpt-4o-mini</option><option value="__manage__">Manage models…</option></select></div><div class="top-actions"><button class="iconbtn" id="topAppearance" aria-label="Appearance">☼</button><button class="iconbtn" id="topConnections" aria-label="Connections">⚙</button></div></header>
<section class="chat" id="chat"><div class="welcome" id="welcome"><h1>What are we building today?</h1><p>One workspace. Any model.</p><div class="suggestions"><button class="suggest" data-prompt="Explain a difficult concept simply.">✦ Learn something<small>Clear explanations, step by step</small></button><button class="suggest" data-prompt="Help me debug this code. Ask for the code if needed.">⌘ Debug code<small>Find the cause, not just the symptom</small></button><button class="suggest" data-prompt="Compare two approaches to solving a problem.">⇄ Compare ideas<small>Trade-offs and recommendations</small></button><button class="suggest" data-prompt="Help me plan a small project I can build this weekend.">↗ Plan a project<small>Turn an idea into next steps</small></button></div></div><div class="messages" id="messages"></div></section>
<div class="composer-wrap"><form class="composer" id="form"><textarea id="prompt" rows="1" placeholder="Message ModelDeck..." aria-label="Message ModelDeck"></textarea><button class="send" id="send" type="submit" aria-label="Send message">↑</button></form><div class="hint">Bring your own API key · Provider usage and billing still apply</div><div class="status" id="status" role="status" aria-live="polite"></div></div></main></div>
<button class="drawer-shade" id="drawerShade" type="button" aria-label="Close navigation"></button><div class="overlay" id="settings" aria-hidden="true"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><h2 id="sheetTitle">Appearance</h2><p class="sub" id="sheetSub">Make ModelDeck feel like yours.</p><div id="sheetContent"></div><div class="foot"><button class="secondary" id="close">Done</button><button class="primary" id="save">Save settings</button></div></section></div>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id),store='modeldeck-ghpages-v2',themeStore='modeldeck-theme-v2';
const providers={
openrouter:{name:'OpenRouter',defaultModel:'openai/gpt-4o-mini',baseUrl:'https://openrouter.ai/api/v1',type:'openai'},
openai:{name:'OpenAI',defaultModel:'gpt-4o-mini',baseUrl:'https://api.openai.com/v1',type:'openai'},
gemini:{name:'Google Gemini',defaultModel:'gemini-2.5-flash',baseUrl:'https://generativelanguage.googleapis.com/v1beta',type:'gemini'},
anthropic:{name:'Anthropic Claude',defaultModel:'claude-3-5-haiku-latest',baseUrl:'https://api.anthropic.com/v1',type:'anthropic'},
groq:{name:'Groq',defaultModel:'llama-3.3-70b-versatile',baseUrl:'https://api.groq.com/openai/v1',type:'openai'},
deepseek:{name:'DeepSeek',defaultModel:'deepseek-chat',baseUrl:'https://api.deepseek.com',type:'openai'},
omniroute:{name:'OmniRoute',defaultModel:'auto',baseUrl:'http://localhost:20128/v1',type:'openai'},
nvidia:{name:'NVIDIA NIM',defaultModel:'nvidia/llama-3.3-nemotron-super-49b-v1.5',baseUrl:'https://integrate.api.nvidia.com/v1',type:'openai'},
custom:{name:'OpenAI-compatible URL',defaultModel:'',baseUrl:'',type:'openai'}
};
const accents={blue:['Apple Blue','#3478f6'],midnight:['Midnight','#727c91'],emerald:['Emerald','#169b72'],violet:['Violet','#8064df'],rose:['Rose','#d95780'],amber:['Amber','#ad741b'],ocean:['Ocean','#087f9a']};
let storageWarning=false,active=null,mode='system',accent='blue',kind='appearance',busy=false,loadingModels=false;
function read(k){try{return localStorage.getItem(k)}catch(e){storageWarning=true;return null}}function write(k,v){try{localStorage.setItem(k,v);return true}catch(e){storageWarning=true;return false}}function parse(raw,fallback){try{return raw?JSON.parse(raw):fallback}catch(e){return fallback}}
function normalizeId(id,p){id=String(id||'').trim();if(p==='gemini')id=id.replace(/^models\//,'');if(p!=='openrouter')id=id.replace(/^openrouter\/(?=[^/]+\/)/,'');return id}
function load(){const raw=parse(read(store),null)||parse(read('modeldeck-ghpages-v1'),{}),s=raw&&typeof raw==='object'?raw:{},keys=s.keys&&typeof s.keys==='object'?s.keys:{},models=s.models&&typeof s.models==='object'?s.models:{},baseUrls=s.baseUrls&&typeof s.baseUrls==='object'?s.baseUrls:{},available=s.availableModels&&typeof s.availableModels==='object'?s.availableModels:{};let provider=providers[s.provider]?s.provider:'openrouter';if(s.model&&!models[provider])models[provider]=normalizeId(s.model,provider);for(const [p,v] of Object.entries(providers)){if(typeof models[p]!=='string')models[p]=v.defaultModel;if(p==='openrouter')models[p]=models[p].replace(/^openrouter\//,'');else if(models[p].startsWith('openrouter/'))models[p]=v.defaultModel;if(typeof baseUrls[p]!=='string'||!baseUrls[p])baseUrls[p]=p==='custom'?(s.customBaseUrl||''):v.baseUrl;available[p]=Array.isArray(available[p])?available[p].map(x=>typeof x==='string'?{id:x,name:x}:x).filter(x=>x&&typeof x.id==='string') : []}
const chats=Array.isArray(s.chats)?s.chats.filter(c=>c&&typeof c==='object'&&Array.isArray(c.messages)).map(c=>{if(!providers[c.provider])c.provider=provider;if(typeof c.model==='string'&&c.model.startsWith('openrouter/'))c.model=c.provider==='openrouter'?c.model.replace(/^openrouter\//,''):(providers[c.provider]?.defaultModel||'');c.messages.forEach(m=>{if(m&&m.loading){m.content='This request was interrupted when ModelDeck was closed. Send your message again to retry.';m.error=true;delete m.loading}});return c}):[];
const connections=Array.isArray(s.connections)?s.connections.filter(x=>x&&x.id&&providers[x.provider]).map(x=>({id:x.id,name:x.name||providers[x.provider].name,provider:x.provider,apiKey:x.apiKey||'',baseUrl:x.baseUrl||baseUrls[x.provider]||providers[x.provider].baseUrl||'',model:x.model||models[x.provider]||providers[x.provider].defaultModel||'',availableModels:Array.isArray(x.availableModels)?x.availableModels:[]})):[];if(!connections.length){for(const p of Object.keys(providers)){if(keys[p])connections.push({id:'legacy-'+p,name:providers[p].name,provider:p,apiKey:keys[p],baseUrl:baseUrls[p]||providers[p].baseUrl||'',model:models[p]||providers[p].defaultModel||'',availableModels:available[p]||[]})}}if(!connections.length)connections.push({id:'conn-default',name:providers[provider].name,provider,apiKey:keys[provider]||'',baseUrl:baseUrls[provider]||providers[provider].baseUrl||'',model:models[provider]||providers[provider].defaultModel||'',availableModels:available[provider]||[]});const selectedConnectionId=connections.some(x=>x.id===s.selectedConnectionId)?s.selectedConnectionId:connections[0].id;return{chats,keys,models,baseUrls,availableModels:available,provider,customBaseUrl:typeof s.customBaseUrl==='string'?s.customBaseUrl:'',connections,selectedConnectionId}}
const hadCurrent=!!read(store),hadLegacy=!!read('modeldeck-ghpages-v1');const state=load();if(!hadCurrent&&hadLegacy&&write(store,JSON.stringify(state))){try{localStorage.removeItem('modeldeck-ghpages-v1')}catch(e){}}
function currentConnection(){return state.connections.find(x=>x.id===(active?.connectionId||state.selectedConnectionId))||state.connections[0]}function syncConnection(x){if(!x)return;state.selectedConnectionId=x.id;state.provider=x.provider;state.keys[x.provider]=x.apiKey;state.baseUrls[x.provider]=x.baseUrl;state.models[x.provider]=x.model;state.availableModels[x.provider]=x.availableModels||[]}function currentModel(p){const x=currentConnection();p=p||x?.provider||state.provider;return normalizeId(x&&x.provider===p?x.model:state.models[p]||providers[p].defaultModel||'',p)}
function persist(){if(!write(store,JSON.stringify(state)))notice('Browser storage is unavailable or full. Your latest changes may not be saved.')}
function notice(s){const n=$('status');if(n)n.textContent=s||''}
function applyTheme(){document.documentElement.dataset.mode=mode;document.documentElement.dataset.accent=accent;$('themeLabel').textContent=mode[0].toUpperCase()+mode.slice(1)+' · '+(accents[accent]?.[0]||'Apple Blue');const dark=mode==='dark'||(mode==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.querySelector('meta[name=theme-color]').content=dark?'#101012':'#f5f5f7'}
const savedTheme=parse(read(themeStore),null)||parse(read('modeldeck-theme-v1'),{});mode=['light','dark','system'].includes(savedTheme.mode)?savedTheme.mode:'system';accent=accents[savedTheme.accent]?savedTheme.accent:'blue';applyTheme();if(window.matchMedia)matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if(mode==='system')applyTheme()});
function cacheFor(p){return(state.availableModels[p]||[]).map(x=>typeof x==='string'?{id:x,name:x}:x).filter(x=>x&&typeof x.id==='string')}
function modelLabel(x){return x.name&&x.name!==x.id?x.name+' — '+x.id:x.id}
function populateHeader(){const sel=$('model'),x=currentConnection(),p=active?.provider||x?.provider||state.provider,current=normalizeId(active?.model||currentModel(p),p),items=x&&x.provider===p?(x.availableModels||[]):cacheFor(p);sel.replaceChildren();if(!items.some(x=>x.id===current)){const opt=document.createElement('option');opt.value=current;opt.textContent=current||'Choose a model';sel.append(opt)}items.forEach(x=>{const opt=document.createElement('option');opt.value=x.id;opt.textContent=modelLabel(x);opt.title=x.id;sel.append(opt)});const manage=document.createElement('option');manage.value='__manage__';manage.textContent='Manage / refresh models…';sel.append(manage);const switcher=document.createElement('option');switcher.value='__connections__';switcher.textContent='Switch API key / connection…';sel.append(switcher);sel.value=current;if(sel.value!==current)sel.selectedIndex=0;sel.title=(providers[p]?.name||p)+' · '+current}
