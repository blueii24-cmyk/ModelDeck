<!doctype html>
<html lang="en" data-mode="system" data-accent="blue">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8"><title>ModelDeck — One workspace. Any model.</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--panel:#fff;--panel2:#eff0f3;--text:#202127;--muted:#777985;--line:#e2e3e8;--accent:#3478f6;--accent-soft:#e7efff;--bubble:#e9ebef;--shadow:0 14px 40px #141a2412;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
html[data-mode=dark]{--bg:#111214;--panel:#191a1e;--panel2:#232429;--text:#f4f4f6;--muted:#a1a2ac;--line:#34353c;--accent-soft:#252f44;--bubble:#292a30;--shadow:0 16px 48px #0005}
@media(prefers-color-scheme:dark){html[data-mode=system]{--bg:#111214;--panel:#191a1e;--panel2:#232429;--text:#f4f4f6;--muted:#a1a2ac;--line:#34353c;--accent-soft:#252f44;--bubble:#292a30;--shadow:0 16px 48px #0005}}
html[data-accent=midnight]{--accent:#727c91;--accent-soft:#e9ebef}html[data-accent=emerald]{--accent:#20a779;--accent-soft:#dff6ed}html[data-accent=violet]{--accent:#8b72e8;--accent-soft:#eee9ff}html[data-accent=rose]{--accent:#df648a;--accent-soft:#ffe7ef}html[data-accent=amber]{--accent:#bd7b16;--accent-soft:#fff0d6}html[data-accent=ocean]{--accent:#078aa7;--accent-soft:#d9f5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);transition:background .2s,color .2s}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}.app{display:grid;grid-template-columns:258px minmax(0,1fr);height:100dvh;max-width:1600px;margin:auto}.side{padding:18px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;background:var(--panel)}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:19px;padding:4px 8px}.logo{width:28px;height:28px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:white}.new,.primary{background:var(--accent);color:white;border:0;border-radius:13px;padding:11px 14px;font-weight:650;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 20%,transparent);transition:transform .16s,filter .16s}.new:hover,.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}.navbtn,.history button{background:transparent;border:0;text-align:left;padding:10px 11px;border-radius:10px;color:var(--muted);width:100%}.navbtn:hover,.history button:hover{background:var(--panel2);color:var(--text)}.side-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:4px 10px}.history{overflow:auto;display:grid;gap:3px}.side-bottom{margin-top:auto;display:grid;gap:5px}.main{min-width:0;display:flex;flex-direction:column;position:relative}.top{height:62px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:12px}.modelpick{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 11px;max-width:70%;font-weight:600}.top-actions{display:flex;gap:8px}.iconbtn{width:38px;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:12px;display:grid;place-items:center}.chat{width:min(820px,100%);margin:0 auto;flex:1;overflow:auto;padding:32px 22px 20px;scroll-behavior:smooth}.welcome{min-height:60%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px}.welcome h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.04em;margin:0}.welcome p{color:var(--muted);margin:0}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px;width:min(570px,100%)}.suggest{background:var(--panel);border:1px solid var(--line);border-radius:15px;text-align:left;padding:14px;transition:transform .16s,border-color .16s}.suggest:hover{transform:translateY(-2px);border-color:var(--accent)}.suggest small{display:block;color:var(--muted);margin-top:3px}.messages{display:grid;gap:24px}.message{animation:rise .22s ease both;max-width:100%}.message.user{margin-left:auto;max-width:85%;background:var(--bubble);padding:12px 16px;border-radius:20px 20px 5px 20px;white-space:pre-wrap;overflow-wrap:anywhere}.message.assistant{white-space:pre-wrap;overflow-wrap:anywhere}.message.assistant pre{white-space:pre;overflow:auto;background:var(--panel2);padding:14px;border-radius:12px}.composer-wrap{padding:8px 20px max(18px,env(safe-area-inset-bottom));width:min(860px,100%);margin:0 auto}.composer{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px;padding:12px;display:flex;align-items:flex-end;gap:10px}.composer textarea{resize:none;min-height:42px;max-height:180px;border:0;outline:0;background:transparent;flex:1;padding:10px 4px}.send{width:42px;height:42px;border:0;border-radius:14px;background:var(--accent);color:white;font-size:20px}.hint{text-align:center;color:var(--muted);font-size:11px;padding-top:8px}.overlay{position:fixed;inset:0;background:#0007;z-index:5;display:none;align-items:flex-end;justify-content:center;padding:14px}.overlay.open{display:flex;animation:fade .15s}.sheet{width:min(560px,100%);max-height:90dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);animation:rise .2s ease}.sheet h2{margin:0 0 4px}.sub{color:var(--muted);margin:0 0 18px;font-size:13px}.field{display:grid;gap:6px;margin:12px 0}.field label,.group-title{font-size:13px;color:var(--muted);font-weight:600}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--bg)}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mode,.theme{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:10px 8px;text-align:center}.mode.selected,.theme.selected{border:2px solid var(--accent);padding:9px 7px}.mode strong,.mode small{display:block}.mode small{font-size:11px;color:var(--muted);margin-top:3px}.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.swatch{width:24px;height:24px;display:block;margin:0 auto 7px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px #0001}.theme{font-size:12px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.secondary{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}.fine{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}.mobile-menu{display:none}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media(max-width:700px){.app{grid-template-columns:1fr}.side{position:fixed;inset:0 auto 0 0;width:min(82vw,300px);z-index:4;transform:translateX(-105%);transition:transform .22s;background:var(--panel);box-shadow:var(--shadow)}.side.open{transform:translateX(0)}.mobile-menu{display:grid}.top{height:58px;padding:0 12px}.chat{padding:24px 16px 12px}.composer-wrap{padding:6px 12px max(12px,env(safe-area-inset-bottom))}.suggestions{grid-template-columns:1fr}.welcome{min-height:52%}.theme-grid{grid-template-columns:repeat(3,1fr)}.sheet{border-radius:24px 24px 18px 18px}.overlay{padding:8px}.top-actions .iconbtn{width:36px;height:36px}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"><div class="brand"><span class="logo">✳</span>ModelDeck</div><button class="new" id="newChat">＋ New chat</button><div class="side-label">Recent chats</div><nav class="history" id="history"></nav><div class="side-bottom"><button class="navbtn" id="connections">⚙ Connections & models</button><button class="navbtn" id="appearance">◐ Appearance <span id="themeLabel">System · Apple Blue</span></button><button class="navbtn" id="clear">⌫ Clear chats</button></div></aside>
<main class="main"><header class="top"><div style="display:flex;align-items:center;gap:8px;min-width:0"><button class="iconbtn mobile-menu" id="menu" aria-label="Open menu">☰</button><select class="modelpick" id="model" aria-label="Model"><option value="openrouter/openai/gpt-4o-mini">OpenRouter · GPT-4o mini</option></select></div><div class="top-actions"><button class="iconbtn" id="topAppearance" aria-label="Appearance">☼</button><button class="iconbtn" id="topConnections" aria-label="Connections">⚙</button></div></header>
<section class="chat" id="chat"><div class="welcome" id="welcome"><h1>What are we building today?</h1><p>One workspace. Any model.</p><div class="suggestions"><button class="suggest" data-prompt="Explain a difficult concept simply.">✦ Learn something<small>Clear explanations, step by step</small></button><button class="suggest" data-prompt="Help me debug this code. Ask for the code if needed.">⌘ Debug code<small>Find the cause, not just the symptom</small></button><button class="suggest" data-prompt="Compare two approaches to solving a problem.">⇄ Compare ideas<small>Trade-offs and recommendations</small></button><button class="suggest" data-prompt="Help me plan a small project I can build this weekend.">↗ Plan a project<small>Turn an idea into next steps</small></button></div></div><div class="messages" id="messages"></div></section>
<div class="composer-wrap"><form class="composer" id="form"><textarea id="prompt" rows="1" placeholder="Message ModelDeck..." aria-label="Message ModelDeck"></textarea><button class="send" type="submit" aria-label="Send message">↑</button></form><div class="hint">Bring your own API key · Provider usage and billing still apply</div></div></main></div>
<div class="overlay" id="settings"><section class="sheet"><h2 id="sheetTitle">Appearance</h2><p class="sub" id="sheetSub">Make ModelDeck feel like yours.</p><div id="sheetContent"></div><div class="foot"><button class="secondary" id="close">Done</button><button class="primary" id="save">Save settings</button></div></section></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),storage='modeldeck-ghpages-v1',themeKey='modeldeck-theme-v1';let state=JSON.parse(localStorage.getItem(storage)||'{"chats":[],"keys":{},"provider":"openrouter","model":"openrouter/openai/gpt-4o-mini"}'),active=null,mode='system',accent='blue',kind='appearance';const accents={blue:['Apple Blue','#3478f6'],midnight:['Midnight','#727c91'],emerald:['Emerald','#20a779'],violet:['Violet','#8b72e8'],rose:['Rose','#df648a'],amber:['Amber','#bd7b16'],ocean:['Ocean','#078aa7']};function persist(){localStorage.setItem(storage,JSON.stringify(state))}function themeSave(){localStorage.setItem(themeKey,JSON.stringify({mode,accent}));applyTheme()}function applyTheme(){document.documentElement.dataset.mode=mode;document.documentElement.dataset.accent=accent;$('themeLabel').textContent=(mode[0].toUpperCase()+mode.slice(1))+' · '+accents[accent][0];document.querySelector('meta[name=theme-color]').content=mode==='light'?'#f5f6f8':mode==='dark'?'#111214':matchMedia('(prefers-color-scheme:dark)').matches?'#111214':'#f5f6f8';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.mode===mode));document.querySelectorAll('[data-accent]').forEach(b=>b.classList.toggle('selected',b.dataset.accent===accent))}try{const t=JSON.parse(localStorage.getItem(themeKey)||'{}');mode=t.mode||'system';accent=t.accent||'blue'}catch{}applyTheme();matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if(mode==='system')applyTheme()});
function newChat(){active={id:Date.now(),title:'New chat',model:$('model').value,messages:[]};state.chats.unshift(active);persist();render()}function render(){ $('history').innerHTML='';state.chats.forEach(c=>{const b=document.createElement('button');b.textContent=c.title||'New chat';b.title=b.textContent;b.onclick=()=>{active=c;$('model').value=c.model||state.model;render();$('side').classList.remove('open')};$('history').append(b)});$('welcome').style.display=active&&active.messages.length?'none':'flex';$('messages').innerHTML='';if(active)active.messages.forEach(m=>{const d=document.createElement('div');d.className='message '+m.role;d.textContent=m.content;$('messages').append(d)});$('chat').scrollTop=$('chat').scrollHeight}function openSettings(type){kind=type;$('settings').classList.add('open');$('sheetTitle').textContent=type==='appearance'?'Appearance':'Connections & models';$('sheetSub').textContent=type==='appearance'?'Preview your colours, then save your favourite.':'Connect a provider using your own API key.';const c=$('sheetContent');if(type==='appearance'){c.innerHTML='<div class="group-title">Display mode</div><div class="modes">'+[['light','☀','Light','Bright and clear'],['dark','☾','Dark','Easy on the eyes'],['system','◐','System','Follow your device']].map(x=>'<button class="mode '+(mode===x[0]?'selected':'')+'" data-mode="'+x[0]+'"><strong>'+x[1]+' '+x[2]+'</strong><small>'+x[3]+'</small></button>').join('')+'</div><div class="group-title" style="margin-top:20px">Accent theme</div><div class="theme-grid">'+Object.entries(accents).map(([id,x])=>'<button class="theme '+(accent===id?'selected':'')+'" data-accent="'+id+'"><span class="swatch" style="--sw:'+x[1]+'"></span>'+x[0].replace(/^./,s=>s.toUpperCase())+'</button>').join('')+'</div>';c.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;applyTheme();c.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('selected',x===b))});c.querySelectorAll('[data-accent]').forEach(b=>b.onclick=()=>{accent=b.dataset.accent;applyTheme();c.querySelectorAll('[data-accent]').forEach(x=>x.classList.toggle('selected',x===b))})}else{const key=state.keys[state.provider]||'';c.innerHTML='<div class="field"><label for="provider">Provider</label><select id="provider"><option value="openrouter">OpenRouter</option><option value="openai">OpenAI</option><option value="gemini">Google Gemini</option><option value="anthropic">Anthropic Claude</option><option value="groq">Groq</option><option value="deepseek">DeepSeek</option><option value="custom">Custom OpenAI-compatible</option></select></div><div class="field"><label for="apiKey">API key</label><input id="apiKey" type="password" placeholder="Paste your API key" autocomplete="off"></div><div class="field"><label for="modelId">Model ID</label><input id="modelId" value="'+escapeHtml(state.model)+'" placeholder="provider/model-id"></div><div class="fine">Keys are stored in this browser's local storage and are not encrypted. Requests go directly to the provider. Use only on a device you trust.</div>';const p=$('provider');p.value=state.provider;$('apiKey').value=key;$('provider').onchange=()=>{$('apiKey').value=state.keys[p.value]||'';state.provider=p.value}}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('appearance').onclick=()=>openSettings('appearance');$('topAppearance').onclick=()=>openSettings('appearance');$('connections').onclick=()=>openSettings('connections');$('topConnections').onclick=()=>openSettings('connections');$('close').onclick=()=> $('settings').classList.remove('open');$('save').onclick=()=>{if(kind==='appearance'){themeSave()}else{state.provider=$('provider').value;state.keys[state.provider]=$('apiKey').value;state.model=$('modelId').value.trim()||state.model;state.chats.forEach(c=>{if(c===active)c.model=state.model});persist();$('model').innerHTML='<option>'+escapeHtml(state.model)+'</option>'} $('settings').classList.remove('open')};$('settings').onclick=e=>{if(e.target===$('settings'))$('settings').classList.remove('open')};$('newChat').onclick=newChat;$('clear').onclick=()=>{if(confirm('Clear all saved chats?')){state.chats=[];active=null;persist();render()}};$('menu').onclick=()=>$('side').classList.toggle('open');document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('prompt').value=b.dataset.prompt;$('prompt').focus();resize()});function resize(){$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,180)+'px'}$('prompt').addEventListener('input',resize);$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}});
function endpoint(){const p=state.provider;return p==='openrouter'?'https://openrouter.ai/api/v1/chat/completions':p==='openai'?'https://api.openai.com/v1/chat/completions':p==='groq'?'https://api.groq.com/openai/v1/chat/completions':p==='deepseek'?'https://api.deepseek.com/chat/completions':p==='anthropic'?'https://api.anthropic.com/v1/messages':p==='gemini'?'https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(state.model.replace(/^models\//,''))+':generateContent?key='+encodeURIComponent(state.keys.gemini):'https://openrouter.ai/api/v1/chat/completions'}
async function send(text){if(!text.trim())return;if(!state.keys[state.provider]){openSettings('connections');$('sheetSub').textContent='Add an API key for '+state.provider+' before chatting.';return}if(!active)newChat();active.model=state.model;active.messages.push({role:'user',content:text});if(active.title==='New chat')active.title=text.slice(0,34);persist();render();$('prompt').value='';resize();const loading={role:'assistant',content:'Thinking…'};active.messages.push(loading);render();try{let res,body,headers={'Content-Type':'application/json'};if(state.provider==='gemini'){body={contents:active.messages.filter(m=>m!==loading).map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}))};res=await fetch(endpoint(),{method:'POST',headers,body:JSON.stringify(body)})}else if(state.provider==='anthropic'){headers['x-api-key']=state.keys.anthropic;headers['anthropic-version']='2023-06-01';headers['anthropic-dangerous-direct-browser-access']='true';body={model:state.model.replace(/^claude:/,''),max_tokens:2048,messages:active.messages.filter(m=>m!==loading).map(m=>({role:m.role,content:m.content}))};res=await fetch(endpoint(),{method:'POST',headers,body:JSON.stringify(body)})}else{headers.Authorization='Bearer '+state.keys[state.provider];body={model:state.model,messages:active.messages.filter(m=>m!==loading).map(m=>({role:m.role,content:m.content}))};res=await fetch(endpoint(),{method:'POST',headers,body:JSON.stringify(body)})}const data=await res.json();if(!res.ok)throw Error(data.error?.message||data.message||'Request failed ('+res.status+')');loading.content=state.provider==='gemini'?data.candidates?.[0]?.content?.parts?.map(p=>p.text).join('\n')||'No response returned.':state.provider==='anthropic'?data.content?.map(p=>p.text||'').join('\n')||'No response returned.':data.choices?.[0]?.message?.content||'No response returned.'}catch(e){loading.content='Error: '+e.message+'\n\nCheck the provider, model ID, API key, and whether the provider allows browser requests (CORS).'}persist();render()}
$('form').onsubmit=e=>{e.preventDefault();const t=$('prompt').value;send(t)};if(!state.chats.length){}else{active=state.chats[0];$('model').innerHTML='<option>'+escapeHtml(active.model||state.model)+'</option>'}render();
})();
</script></body></html>
